name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem web,tools -Recurse -File -Include *.js,*.cjs,*.mjs
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $file" }
          }
      - name: Build application
        run: go build -trimpath -ldflags="-H=windowsgui" -o LampGuide.exe .
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LampGuide-windows-x64
          path: LampGuide.exe
          if-no-files-found: error
