name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem web,tools -Recurse -File -Include *.js,*.cjs,*.mjs
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $file" }
          }
      - name: Read version
        shell: pwsh
        run: |
          $fixed = (Get-Content packaging/winres.json -Raw | ConvertFrom-Json).RT_VERSION.'#1'.'0000'.fixed
          $version = $fixed.file_version -replace '\.0$', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Bad version in winres.json: $version" }
          if ($fixed.product_version -ne "${version}.0") { throw 'file_version and product_version disagree' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install build tools
        shell: pwsh
        run: |
          npm ci --ignore-scripts --prefix packaging
          if ($LASTEXITCODE -ne 0) { throw 'Asset tooling install failed.' }
          go install github.com/tc-hib/go-winres@v0.3.3
          if ($LASTEXITCODE -ne 0) { throw 'go-winres install failed.' }
      - name: Render icons and version resources
        shell: pwsh
        run: |
          node tools/build-assets.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Icon rendering failed.' }
          $winres = Join-Path (go env GOPATH) 'bin\go-winres.exe'
          & $winres make --in packaging/winres.json --arch amd64 --out rsrc --file-version "${env:APP_VERSION}.0" --product-version "${env:APP_VERSION}.0"
          if ($LASTEXITCODE -ne 0) { throw 'Windows resource compilation failed.' }
      - name: Build application
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $exe = "dist/LampGuide-${env:APP_VERSION}-win-x64.exe"
          $feed = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
          $flags = "-H=windowsgui -s -w -X zenui/internal/zen/gateway.Version=${env:APP_VERSION} -X zenui/internal/zen/update.Current=${env:APP_VERSION} -X zenui/internal/zen/update.FeedURL=$feed"
          go build -trimpath -ldflags $flags -o $exe .
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed.' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $absolute = (Resolve-Path -LiteralPath $exe).Path
          [IO.File]::WriteAllText("$absolute.sha256", "$hash  $([IO.Path]::GetFileName($exe))`n", [Text.UTF8Encoding]::new($false))
          Get-Item -LiteralPath $exe | Select-Object FullName,Length
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LampGuide-windows-x64
          path: |
            dist/LampGuide-*.exe
            dist/LampGuide-*.exe.sha256
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/LampGuide-${env:APP_VERSION}-win-x64.exe" `
            "dist/LampGuide-${env:APP_VERSION}-win-x64.exe.sha256" `
            --title "Lamp Guide ${env:APP_VERSION}" `
            --notes "Automated Windows build." `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed.' }
